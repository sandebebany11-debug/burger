# Baut die Demo-Version (ohne Server, mit Demo-Login) und veröffentlicht sie
# auf dem Branch gh-pages. In GitHub einmalig aktivieren:
# Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / (root)
name: Demo auf GitHub Pages

on:
  push:
    branches: [claude/art-of-hair-simyan]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - name: Veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-preview
          publish_branch: gh-pages
          force_orphan: true
